<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey Drew Studios | Premium Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    <!-- Подключаем иконки -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* --- 1. PREMIUM PALETTE & RESET --- */
        :root {
            --void-black: #050402;
            --ink-black: #0f0b05;
            --amber-dim: #8a6a3c;
            --amber-rich: #ffae00; /* Тот самый насыщенный желтый */
            --amber-pale: #fceeb5;
            --paper-texture: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            --shadow-hard: 0 10px 30px rgba(0,0,0,0.9);
        }

        * { box-sizing: border-box; scrollbar-width: thin; }

        body {
            margin: 0;
            background-color: var(--void-black);
            color: var(--amber-pale);
            font-family: 'Special Elite', monospace;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. ATMOSPHERE LAYERS --- */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 130%);
            z-index: 1;
            pointer-events: none;
        }

        /* --- 3. NAVIGATION (Sticky & Premium) --- */
        nav {
            z-index: 100;
            background: rgba(5, 4, 2, 0.95);
            border-bottom: 1px solid var(--amber-dim);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px #000;
        }

        .logo {
            font-family: 'Creepster', cursive;
            font-size: 2.2rem;
            color: var(--amber-rich);
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 174, 0, 0.2);
        }

        .menu { display: flex; gap: 30px; }

        .menu-btn {
            background: none;
            border: none;
            color: var(--amber-dim);
            font-family: 'Rye', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .menu-btn:hover, .menu-btn.active {
            color: var(--amber-rich);
            text-shadow: 0 0 8px var(--amber-rich);
        }

        /* --- 4. CONTENT AREA --- */
        #content-stage {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 40px;
            z-index: 2;
        }

        /* Custom Scrollbar */
        #content-stage::-webkit-scrollbar { width: 8px; }
        #content-stage::-webkit-scrollbar-track { background: #000; }
        #content-stage::-webkit-scrollbar-thumb { background: var(--amber-dim); border-radius: 4px; }

        .section { display: none; opacity: 0; transition: opacity 0.5s ease; max-width: 1000px; margin: 0 auto; padding-bottom: 100px; }
        .section.active { display: block; opacity: 1; }

        h2 {
            font-family: 'Rye', serif;
            font-size: 3.5rem;
            color: var(--amber-rich);
            border-bottom: 2px solid var(--amber-dim);
            margin-bottom: 40px;
            text-align: center;
        }

        /* --- 5. TIMELINE DESIGN (Redesigned) --- */
        .timeline-wrapper {
            position: relative;
            border-left: 3px solid var(--amber-dim);
            margin-left: 20px;
            padding: 20px 0 20px 40px;
        }

        .era-label {
            font-family: 'Creepster';
            font-size: 2.5rem;
            color: var(--amber-rich);
            margin: 40px 0 20px -55px;
            text-shadow: 4px 4px 0 #000;
        }

        .timeline-card {
            background: linear-gradient(145deg, #14100a, #0a0805);
            border: 1px solid var(--amber-dim);
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            border-radius: 4px;
            box-shadow: var(--shadow-hard);
            transition: transform 0.2s;
        }

        .timeline-card:hover {
            border-color: var(--amber-rich);
            transform: translateX(5px);
        }

        /* Точка на линии */
        .timeline-card::before {
            content: '';
            position: absolute;
            left: -47px; top: 25px;
            width: 12px; height: 12px;
            background: var(--amber-rich);
            border: 3px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--amber-rich);
        }

        .t-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(138, 106, 60, 0.3);
            padding-bottom: 10px;
        }

        .t-year { font-family: 'Rye'; font-size: 1.4rem; color: var(--amber-rich); }
        
        /* Кнопка закрепления (PIN) */
        .pin-btn {
            background: none;
            border: none;
            color: var(--amber-dim);
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .pin-btn:hover { color: var(--amber-rich); transform: scale(1.2); }
        .pin-btn.pinned { color: var(--amber-rich); text-shadow: 0 0 10px var(--amber-rich); }

        .t-body ul { padding-left: 20px; margin: 0; }
        .t-body li { margin-bottom: 8px; line-height: 1.6; color: #ddd; }

        /* --- 6. EVIDENCE BOARD (Pinned Items) --- */
        #evidence-board {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            max-height: 60vh;
            background: rgba(10, 8, 5, 0.95);
            border: 2px solid var(--amber-rich);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            transform: translateY(110%); /* Скрыто по умолчанию */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #evidence-board.open { transform: translateY(0); }

        .board-header {
            background: var(--amber-rich);
            color: #000;
            padding: 10px;
            font-family: 'Rye';
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .board-content {
            padding: 15px;
            overflow-y: auto;
        }

        .evidence-item {
            background: #1a1510;
            border-left: 3px solid var(--amber-rich);
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            position: relative;
        }
        
        .evidence-remove {
            position: absolute;
            top: 5px; right: 5px;
            color: #555;
            cursor: pointer;
        }
        .evidence-remove:hover { color: #f00; }

        /* Floating Toggle for Board */
        #board-toggle {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--amber-rich);
            color: #000;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 201;
            box-shadow: 0 0 15px var(--amber-rich);
            border: 2px solid #000;
        }
        #board-toggle:hover { transform: scale(1.1); }
        
        /* --- OTHER SECTIONS (Simplified for brevity) --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .box-item { background: #111; border: 1px solid var(--amber-dim); height: 150px; display: flex; align-items: center; justify-content: center; }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <nav>
        <div class="logo">JOEY DREW STUDIOS</div>
        <div class="menu">
            <button class="menu-btn active" onclick="nav('timeline')">Timeline</button>
            <button class="menu-btn" onclick="nav('calendar')">Calendar</button>
            <button class="menu-btn" onclick="nav('games')">Games</button>
            <button class="menu-btn" onclick="nav('lore')">Lore</button>
        </div>
    </nav>

    <div id="content-stage">
        
        <!-- TIMELINE -->
        <section id="timeline" class="section active">
            <h2>The Complete History</h2>
            <div class="timeline-wrapper" id="timeline-feed">
                <!-- JS renders cards here -->
            </div>
        </section>

        <!-- Other Sections (Placeholders) -->
        <section id="calendar" class="section"><h2>Events Log</h2><div class="box-item">Calendar Module</div></section>
        <section id="games" class="section"><h2>Game Library</h2><div class="box-item">Games Module</div></section>
        <section id="lore" class="section"><h2>Dark Secrets</h2><div class="box-item">Lore Module</div></section>
    </div>

    <!-- EVIDENCE BOARD (PINNED ITEMS) -->
    <div id="board-toggle" onclick="toggleBoard()">
        <i class="fas fa-clipboard-list"></i>
    </div>

    <div id="evidence-board">
        <div class="board-header" onclick="toggleBoard()">
            <span>EVIDENCE COLLECTED</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="board-content" id="pinned-list">
            <div style="text-align:center; opacity:0.5; font-size:0.8rem;">No evidence collected.</div>
        </div>
    </div>

    <script>
        // --- 1. DATA ENGINE (Parsed from your text) ---
        // Я отформатировал твой текст в массив объектов.
        // 'era' используется для создания крупных заголовков.
        const historyData = [
            {
                era: "The Beginning (189X - 1928)",
                year: "189X - 190X",
                title: "Origins",
                events: [
                    "Рождаются Дональдсон и Экхарт.",
                    "Рождается Нэйтан Арч.",
                    "1901: Рождается Джозеф Дрю (Патерсон, Нью-Джерси).",
                    "1906: Джозеф начинает задумываться о понятиях выдумки и реальности."
                ]
            },
            {
                year: "1914 - 1918",
                title: "The Great War",
                events: [
                    "Начинается Первая мировая война.",
                    "Джозеф попадает в Войска связи. Знакомство с Дональдсоном и Экхартом.",
                    "Томас Коннор работает на самолётах.",
                    "1917: Гибель Дональдсона и Экхарта.",
                    "1918: Лотти перестаёт отвечать на письма Джоуи."
                ]
            },
            {
                year: "1919 - 1928",
                title: "Pre-Studio Era",
                events: [
                    "Нэйтан переезжает в Пасадину (нефть и сталь).",
                    "1920: Начало Ревущих двадцатых. Джозеф становится 'Джоуи Дрю' и переезжает в Нью-Йорк.",
                    "1927: Рождается Дот.",
                    "1928: Рождается Даниэль 'Бадди' Левек."
                ]
            },
            {
                era: "The Golden Age (1929 - 1939)",
                year: "1929",
                title: "Dreams Come True",
                events: [
                    "10 февраля: Джоуи основывает студию в Бруклине (6 сотрудников).",
                    "24 февраля: Генри придумывает Бенди.",
                    "Выходят: 'Little Devil Darlin', 'The Dancing Demon'.",
                    "Появляется Борис. Выходит 'Sheep Songs'.",
                    "24 октября: Начало Великой депрессии."
                ]
            },
            {
                year: "1930 - 1931",
                title: "Expansion",
                events: [
                    "Генри уходит из студии. Пишет прощальную записку.",
                    "Студия расширяется. Выходит 'Haunted Hijinx'.",
                    "Начало комиксов: 'Barnyard Opry', 'Sole for Supper'."
                ]
            },
            {
                year: "1932",
                title: "Enter the Angel",
                events: [
                    "Июль: События новеллы 'Sent From Above'. Сьюзи Кэмпбелл нанимается.",
                    "Август: Анонс Элис Энджел.",
                    "Сентябрь: Элис в газетах. Выход 'Siren Serenade'.",
                    "Выход комиксов: 'Counting Sheeps' (Шерстистые Тройняшки)."
                ]
            },
            {
                year: "1933 - 1934",
                title: "Merchandising",
                events: [
                    "Сьюзи обедает с Джоуи (роковой момент).",
                    "Уолли видит Сьюзи с Сэмми.",
                    "Открываются 'The Heavenly Toys' (Небесные Игрушки).",
                    "1934: Выходят игрушки Бенди и Бориса. Комикс 'Graduation Day'."
                ]
            },
            {
                year: "1935 - 1939",
                title: "The Butcher Gang",
                events: [
                    "1935: Появляется Банда Мясников (Чарли, Барли, Эдгар).",
                    "1936: Сотрудничество с Brial Label. Рецепт Супа с Беконом.",
                    "1937: Появление Папы Плуто.",
                    "1939: Начало Второй мировой войны."
                ]
            },
            {
                era: "The Descent (1940 - 1948)",
                year: "1940",
                title: "Bendyland & The Machine",
                events: [
                    "Разработка парка 'Бендиленд'. Бертрум Пьидмонт нанят.",
                    "Создание Аниматроника Бенди.",
                    "Первая версия Чернильной Машины (Gent Corp, Томас Коннор)."
                ]
            },
            {
                year: "1941 - 1942",
                title: "The Ink Flows",
                events: [
                    "Эллисон Пендл заменяет Сьюзи как голос Элис.",
                    "Создание Второй Чернильной Машины.",
                    "Первый ритуал. Сьюзи превращается в Искателя.",
                    "Джоуи пишет 'Иллюзия Жизни'.",
                    "Отдел комиксов закрывается."
                ]
            },
            {
                year: "1946",
                title: "The Ink Demon",
                events: [
                    "Создание Гигантской Чернильной Машины.",
                    "Рождение Чернильного Демона (без души).",
                    "События книги 'Dreams Come to Life' (Бадди, Дот).",
                    "Сэмми пьет чернила. Бадди превращается в Бориса.",
                    "Джоуи покупает театр."
                ]
            },
            {
                year: "1948",
                title: "Bankruptcy",
                events: [
                    "Бендиленд открывается, но Джоуи крадет славу у Бертрума.",
                    "15 августа: Отчет о банкротстве.",
                    "28 августа: Студия закрывается навсегда."
                ]
            },
            {
                era: "The Cycle (1963 - 197X)",
                year: "1963",
                title: "Henry's Return",
                events: [
                    "Август: Генри Штейн получает письмо и возвращается.",
                    "События 'Bendy and the Ink Machine' (Главы 1-5).",
                    "Падение Сэмми, Искаженной Элис и конец Демона."
                ]
            },
            {
                year: "197X",
                title: "Archgate Era",
                events: [
                    "Нэйтан Арч выкупает права на Бенди.",
                    "События 'Dark Revival' (Одри)."
                ]
            }
        ];

        // --- 2. RENDER LOGIC ---
        
        const timelineFeed = document.getElementById('timeline-feed');
        const pinnedList = document.getElementById('pinned-list');
        let pinnedIds = [];

        function renderTimeline() {
            let html = '';
            let currentEra = '';

            historyData.forEach((item, index) => {
                // Add Era Heading if new
                if(item.era && item.era !== currentEra) {
                    html += `<div class="era-label">${item.era}</div>`;
                    currentEra = item.era;
                }

                // Generate list items
                const eventsHtml = item.events.map(e => `<li>${e}</li>`).join('');
                const uniqueId = `evt-${index}`;

                html += `
                    <div class="timeline-card" id="${uniqueId}">
                        <div class="t-header">
                            <div>
                                <div class="t-year">${item.year}</div>
                                <div style="color:#888; font-size:0.9rem;">${item.title}</div>
                            </div>
                            <button class="pin-btn" onclick="togglePin(${index})" id="btn-${index}">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                        </div>
                        <div class="t-body">
                            <ul>${eventsHtml}</ul>
                        </div>
                    </div>
                `;
            });
            timelineFeed.innerHTML = html;
        }

        // --- 3. PIN SYSTEM LOGIC ---

        function togglePin(index) {
            const btn = document.getElementById(`btn-${index}`);
            
            if (pinnedIds.includes(index)) {
                // Unpin
                pinnedIds = pinnedIds.filter(id => id !== index);
                btn.classList.remove('pinned');
            } else {
                // Pin
                pinnedIds.push(index);
                btn.classList.add('pinned');
                
                // Open board automatically on first pin
                const board = document.getElementById('evidence-board');
                if (!board.classList.contains('open')) board.classList.add('open');
            }
            
            renderEvidenceBoard();
        }

        function renderEvidenceBoard() {
            if (pinnedIds.length === 0) {
                pinnedList.innerHTML = '<div style="text-align:center; opacity:0.5; font-size:0.8rem; padding-top:20px;">Улик не найдено...</div>';
                return;
            }

            let html = '';
            pinnedIds.forEach(id => {
                const data = historyData[id];
                html += `
                    <div class="evidence-item">
                        <i class="fas fa-times evidence-remove" onclick="togglePin(${id})"></i>
                        <strong style="color:var(--amber-rich)">${data.year}</strong><br>
                        <span style="font-size:0.8rem; color:#bbb">${data.title}</span>
                    </div>
                `;
            });
            pinnedList.innerHTML = html;
        }

        function toggleBoard() {
            document.getElementById('evidence-board').classList.toggle('open');
        }

        // --- 4. NAVIGATION LOGIC ---
        function nav(sectionId) {
            // Update buttons
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            // Update sections
            document.querySelectorAll('.section').forEach(s => {
                s.style.opacity = 0;
                setTimeout(() => {
                    s.classList.remove('active');
                    if(s.id === sectionId) {
                        s.classList.add('active');
                        setTimeout(() => s.style.opacity = 1, 50);
                    }
                }, 400);
            });
        }

        // Init
        renderTimeline();

    </script>
</body>
</html>
