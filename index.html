<!-- CALENDAR SECTION -->
<section id="calendar" class="section">
    <div class="section-header">
        <h1>Release Log</h1>
        <p>Ключевые даты выпуска контента студии.</p>
    </div>

    <div class="calendar-container">
        <!-- Левая часть: Сетка календаря -->
        <div class="calendar-main">
            <div class="cal-header">
                <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                <div class="cal-title" id="cal-month-label">LOADING...</div>
                <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="weekdays-grid">
                <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
            </div>
            
            <div class="days-grid" id="cal-days-grid">
                <!-- Days injected by JS -->
            </div>
        </div>

        <!-- Правая часть: Инспектор события -->
        <div class="calendar-inspector" id="cal-inspector">
            <div class="inspector-placeholder">
                <i class="fas fa-mouse-pointer"></i>
                <p>Выберите дату с маркером,<br>чтобы увидеть детали.</p>
            </div>
            <div class="inspector-content hidden" id="inspector-details">
                <div class="event-badge" id="insp-type">GAME RELEASE</div>
                <h2 id="insp-title">Bendy and the Ink Machine</h2>
                <div class="insp-date" id="insp-date-text">February 10, 1929</div>
                <p id="insp-desc">The first chapter was released, setting the tone for the horror that would follow.</p>
                <div class="insp-image-box" id="insp-img">
                    <!-- Image injected via JS background -->
                </div>
            </div>
        </div>
    </div>
</section>
