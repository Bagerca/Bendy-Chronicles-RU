<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendy Chronicles</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем ретро-шрифт (похож на печатную машинку или постеры 30-х) -->
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="film-header">
        <!-- Левая бобина -->
        <div class="reel-container">
            <div class="reel">
                <div class="reel-inner">
                    <span class="reel-text">WELCOME</span>
                </div>
            </div>
        </div>

        <!-- Центральная лента (Навигация) -->
        <nav class="film-strip">
            <div class="film-holes-top"></div>
            <ul class="nav-list">
                <li class="nav-item active">
                    <span class="nav-num">01</span>
                    <span class="nav-text">Главная</span>
                </li>
                <li class="nav-item">
                    <span class="nav-num">02</span>
                    <span class="nav-text">Продукты</span>
                </li>
                <li class="nav-item">
                    <span class="nav-num">03</span>
                    <span class="nav-text">Лор</span>
                </li>
                <li class="nav-item">
                    <span class="nav-num">04</span>
                    <span class="nav-text">Хроники</span>
                </li>
                <li class="nav-item">
                    <span class="nav-num">05</span>
                    <span class="nav-text">События</span>
                </li>
            </ul>
            <div class="film-holes-bottom"></div>
        </nav>

        <!-- Правая бобина -->
        <div class="reel-container">
            <div class="reel reverse-spin">
                <div class="reel-inner">
                    <span class="reel-text">HOME</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Остальной контент (для примера) -->
    <main>
        <h1>BENDY CHRONICLES</h1>
    </main>

</body>
</html>
