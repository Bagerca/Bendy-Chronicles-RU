<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendy Chronicles</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="projector-overlay"></div>
    
    <header class="cinema-header">
        <!-- Движущаяся фоновая пленка -->
        <div class="moving-film-bg"></div>

        <div class="header-container">
            <!-- ЛЕВАЯ БОБИНА (5 отверстий) -->
            <div class="header-reel left-reel">
                <div class="bendy-reel-disc">
                    <div class="film-texture-bg"></div>
                    <div class="reel-holes-layer">
                        <div class="b-hole"></div><div class="b-hole"></div>
                        <div class="b-hole"></div><div class="b-hole"></div>
                        <div class="b-hole"></div>
                    </div>
                    <div class="center-cap"></div>
                    <!-- Текст поверх бобины -->
                    <div class="reel-label">WELCOME</div> 
                </div>
            </div>

            <nav class="film-navigation">
                <!-- Центральная декоративная пленка (старая навигация) -->
                <div class="film-strip-decor"></div>
                
                <!-- Кнопки навигации -->
                <div class="nav-frames">
                    <a href="#home" class="frame-cell active" data-page="home">
                        <span class="frame-number">01</span>
                        <span class="frame-title">Главная</span>
                    </a>
                    <a href="#products" class="frame-cell" data-page="products">
                        <span class="frame-number">02</span>
                        <span class="frame-title">Продукты</span>
                    </a>
                    <a href="#lore" class="frame-cell" data-page="lore">
                        <span class="frame-number">03</span>
                        <span class="frame-title">Лор</span>
                    </a>
                    <a href="#timeline" class="frame-cell" data-page="timeline">
                        <span class="frame-number">04</span>
                        <span class="frame-title">Хроники</span>
                    </a>
                    <a href="#events" class="frame-cell" data-page="events">
                        <span class="frame-number">05</span>
                        <span class="frame-title">События</span>
                    </a>
                </div>
            </nav>

            <!-- ПРАВАЯ БОБИНА (5 отверстий) -->
            <div class="header-reel right-reel">
                <div class="bendy-reel-disc">
                    <div class="film-texture-bg"></div>
                    <div class="reel-holes-layer">
                        <div class="b-hole"></div><div class="b-hole"></div>
                        <div class="b-hole"></div><div class="b-hole"></div>
                        <div class="b-hole"></div>
                    </div>
                    <div class="center-cap"></div>
                    <div class="reel-label">HOME</div>
                </div>
            </div>

            <div class="projector-light"></div>
        </div>
    </header>

    <!-- MAIN CONTENT (Оставляем без изменений) -->
    <main class="cinema-content">
        <section id="home" class="cinema-page active">
            <div class="page-content">
                <div class="title-sequence">
                    <h1 class="main-title">BENDY CHRONICLES</h1>
                    <p class="subtitle">Where Animation Meets Mystery</p>
                </div>
            </div>
        </section>
        <!-- Остальные секции... -->
    </main>

    <audio id="projectorSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-projector-click-1253.mp3" type="audio/mpeg">
    </audio>
    <audio id="filmSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-film-reel-1251.mp3" type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>
</body>
</html>
